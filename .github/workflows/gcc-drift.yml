name: gcc-drift

# Monthly source-drift check: do the fork's hunks, symbols and behavioural pins
# still match upstream GCC? This never builds anything and never edits the repo;
# see scripts/check-gcc-drift.sh and docs/crug/GCC-UPGRADE.md.

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gcc-drift
  cancel-in-progress: true

jobs:
  drift:
    name: gcc-drift
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the fork with its vendor tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the tools
        run: |
          command -v git
          command -v curl
          command -v python3
      - name: Fork delta
        run: scripts/fork-delta.sh
      - name: Upstream drift
        run: scripts/check-gcc-drift.sh
