name: fuzz-nightly

# Hardening evidence for M22 (docs/crug/RELEASE-POLICY.md section 3): the
# fuzz harnesses and the sanitizer suite at the nightly budget, once a day.
# The window itself is counted by scripts/check-fuzz-nightly.sh, which reads
# the scheduled runs only - a push-triggered run (like this file's own edits)
# never counts towards the thirty-run window.

on:
  schedule:
    # 03:17 UTC daily; scripts/check-fuzz-nightly.sh reads the scheduled runs.
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'fuzz/**'
      - 'scripts/check-fuzz.sh'
      - 'scripts/check-sanitizer.sh'
      - '.github/workflows/fuzz-nightly.yml'

permissions:
  contents: write

concurrency:
  group: fuzz-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz-nightly:
    name: fuzz-nightly
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune -af || true
      - name: Require disk headroom
        run: |
          available=$(df --output=avail -k . | tail -n 1)
          echo "available_kib=$available"
          if [ "$available" -lt 12582912 ]; then
            echo "fuzz-nightly: need at least 12 GiB free, found $available KiB" >&2
            exit 1
          fi
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential flex bison libgmp-dev libmpfr-dev libmpc-dev zstd \
            clang
          clang_major=$(clang -dumpversion | cut -d. -f1)
          sudo apt-get install -y --no-install-recommends "libclang-rt-${clang_major}-dev"
          ls "/usr/lib/llvm-${clang_major}/lib/clang/${clang_major}/lib/linux" \
            | grep -E 'libclang_rt\.(tsan|fuzzer)-x86_64\.a'
      - name: Relax ASLR entropy for ThreadSanitizer
        # clang 18 cannot map the TSan shadow at 32-bit mmap entropy; the runner
        # allows lowering vm.mmap_rnd_bits to 28, and the step warns (does not
        # fail) when it does not.  A TSan arm that still cannot map exits 2.
        run: |
          if [ -w /proc/sys/vm/mmap_rnd_bits ]; then
            echo 28 | sudo tee /proc/sys/vm/mmap_rnd_bits
          else
            echo "fuzz-nightly: /proc/sys/vm/mmap_rnd_bits is not writable" >&2
          fi
      - name: Configure and build the pinned GCC baseline
        run: make baseline JOBS=$(nproc)
      - name: Run the fuzz target for a fixed budget
        run: |
          mkdir -p ci-logs
          make check-FUZZ FUZZ_BUDGET=2000 2>&1 | tee ci-logs/fuzz.log
      - name: Run the sanitizer suite
        run: |
          mkdir -p ci-logs
          make check-SANITIZER 2>&1 | tee ci-logs/sanitizer.log
      - name: Publish the logs to ci-debug-fuzz23
        if: always()
        run: |
          mkdir -p ci-logs
          printf 'fuzz-nightly debug log for %s (%s)\n' "${{ github.sha }}" "${{ github.event_name }}" > ci-logs/README
          git config user.email ci-debug@example.invalid
          git config user.name ci-debug
          git checkout --orphan ci-debug-fuzz23
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f ci-logs
          git commit -q -m "ci-debug: fuzz-nightly log"
          git push -f origin ci-debug-fuzz23
